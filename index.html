<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Garmin Training</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap">
<style>
:root {
  color-scheme: dark;
  --bg: #000000;
  --card: #1c1c1e;
  --card2: #2c2c2e;
  --border: rgba(255,255,255,0.08);
  --text: #f5f5f7;
  --text2: rgba(235,235,245,0.6);
  --text3: rgba(235,235,245,0.3);
  --cyan: #00e5ff;
  --green: #30d158;
  --red: #ff453a;
  --orange: #ff9f0a;
  --purple: #bf5af2;
  --pink: #ff375f;
  --num: 'Rajdhani', system-ui, sans-serif;
  --body: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', system-ui, sans-serif;
  --r: 12px;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.5 var(--body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.w{max-width:960px;margin:0 auto;padding:24px 0 48px}

/* Header */
.hdr{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:28px}
.hdr h1{font:700 34px/1.1 var(--body);color:var(--text);margin:0;flex:1;letter-spacing:-0.02em}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:8px 16px;font:500 15px var(--num);color:var(--cyan);white-space:nowrap}
.badge .n{font-size:18px;font-weight:700}
.date{font-size:13px;color:var(--text2);white-space:nowrap}

/* Grid */
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:28px}
.c{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:18px;min-width:0}
.c .l{font-size:13px;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:0.04em}
.c .v{font:700 32px/1.1 var(--num);font-variant-numeric:tabular-nums;color:var(--text)}
.c .v .u{font-size:14px;font-weight:500;color:var(--text2);margin-right:2px}
.c .s{font:500 13px var(--num);color:var(--text2);margin-top:4px;font-variant-numeric:tabular-nums}
.c.hi .v{color:var(--cyan)}

/* Section */
.sec{margin-bottom:32px}
.st{font:600 22px/1.2 var(--body);color:var(--text);margin-bottom:14px;letter-spacing:-0.01em}

/* Chart */
.ch{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;min-width:0;overflow-x:auto}
.ci{min-width:500px;position:relative}
.cg{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:12px}
@media(max-width:500px){.cg{grid-template-columns:1fr}.ci{min-width:340px}}

/* Donut */
.br{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:center}
@media(max-width:600px){.br{grid-template-columns:1fr}}
.ll{list-style:none;padding:0;margin:0}
.ll li{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:15px;min-height:44px}
.ld{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.lv{margin-right:auto;font:700 14px var(--num);font-variant-numeric:tabular-nums;color:var(--text2)}

/* Records */
.rg{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.rc{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;text-align:center}
.rc .rv{font:700 24px var(--num);color:var(--cyan);font-variant-numeric:tabular-nums}
.rc .rl{font-size:12px;color:var(--text2);margin-top:2px;text-transform:uppercase;letter-spacing:0.04em}
.rc .rs{font-size:12px;color:var(--text3);margin-top:2px}

/* Table */
.at{width:100%;border-collapse:collapse;font-size:15px}
.at th{text-align:right;font-size:12px;color:var(--text2);text-transform:uppercase;letter-spacing:0.04em;padding:10px;border-bottom:1px solid var(--border);white-space:nowrap}
.at td{padding:12px 10px;border-bottom:1px solid rgba(255,255,255,0.03);font:500 15px var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
.at td:first-child{font-family:var(--body)}
.at tr:hover td{background:rgba(255,255,255,0.03)}
.an{color:var(--text2);font-family:var(--body)!important;font-size:14px}

:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

const twDist=twActs.reduce((s,a)=>s+a.dist,0),twDur=twActs.reduce((s,a)=>s+a.dur,0),twCal=twActs.reduce((s,a)=>s+a.cal,0);
